<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ReviveHR — Super Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
              400: '#4ade80', 500: '#10b981', 600: '#006c49', 700: '#005236',
              800: '#00422b', 900: '#002113',
            },
            charcoal: {
              50: '#f9f9ff', 100: '#f1f3f5', 200: '#e9ecef', 300: '#dee2e6',
              400: '#adb5bd', 500: '#6c7a71', 600: '#495057', 700: '#343a40',
              800: '#111c2d', 900: '#212529',
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body class="h-dvh overflow-hidden flex flex-col bg-charcoal-50 font-sans text-charcoal-800 antialiased">

  <!-- ==================== PROTOTYPE TOOLBAR ==================== -->
  <div class="relative z-[60] flex-shrink-0 h-9 min-h-9 bg-charcoal-800 text-white flex items-center px-3 gap-2 text-xs">
    <div class="flex items-center gap-1.5 font-semibold text-charcoal-200 flex-shrink-0 min-w-0">
      <svg class="w-3.5 h-3.5 text-brand-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <span class="truncate hidden sm:inline">Super Admin Console — Prototype Preview</span>
    </div>
    <div class="flex-1 min-w-0"></div>
    <a href="../index.html" class="flex-shrink-0 px-2 py-0.5 rounded bg-white/10 hover:bg-white/20 transition-colors text-[11px] font-medium">All portals</a>
    <span class="px-2 py-0.5 rounded bg-brand-700 text-brand-100 font-semibold text-[10px] flex-shrink-0">Full platform access</span>
  </div>

  <!-- ==================== APP SHELL ==================== -->
  <div class="flex flex-1 min-h-0">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed top-9 bottom-0 left-0 z-40 w-[232px] bg-white border-r border-charcoal-200 flex flex-col transition-transform duration-300 -translate-x-full lg:translate-x-0">
      <div class="flex items-center gap-2.5 px-4 h-12 border-b border-charcoal-100 flex-shrink-0">
        <div class="w-7 h-7 bg-brand-600 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-bold text-charcoal-900 leading-tight">Revive<span class="text-brand-600">HR</span></p>
          <p class="text-[9px] font-semibold uppercase tracking-wider text-charcoal-400 leading-tight">Platform Console</p>
        </div>
        <button onclick="toggleSidebar()" class="lg:hidden ml-auto p-1 rounded hover:bg-charcoal-100" aria-label="Close menu">
          <svg class="w-4 h-4 text-charcoal-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <nav id="sidebar-nav" class="flex-1 overflow-y-auto py-2 px-2" aria-label="Main navigation"></nav>

      <div class="border-t border-charcoal-100 px-3 py-2 flex-shrink-0">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-[10px] font-semibold flex-shrink-0" id="sidebar-avatar">YE</div>
          <div class="flex-1 min-w-0">
            <p class="text-xs font-semibold text-charcoal-900 truncate leading-tight" id="sidebar-user-name">Youssef Essam</p>
            <p class="text-[10px] text-charcoal-500 truncate leading-tight" id="sidebar-user-role">Super Admin</p>
          </div>
          <button onclick="handleLogout()" class="p-1 rounded hover:bg-charcoal-100 text-charcoal-400 hover:text-charcoal-600 transition-colors" title="Sign out" aria-label="Sign out">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <!-- MAIN COLUMN -->
    <div class="flex-1 flex flex-col min-h-0 min-w-0 lg:ml-[232px]">

      <header class="sticky top-0 z-20 bg-white border-b border-charcoal-100 flex items-center px-3 sm:px-4 gap-2.5 flex-shrink-0 h-12">
        <button onclick="toggleSidebar()" class="lg:hidden p-1.5 -ml-1 rounded hover:bg-charcoal-100" aria-label="Open menu">
          <svg class="w-4 h-4 text-charcoal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="lg:hidden text-sm font-semibold text-charcoal-900 truncate" id="mobile-page-title">Dashboard</h1>

        <div class="hidden md:block relative flex-1 max-w-xs">
          <svg class="absolute left-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-charcoal-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="global-search" type="search" placeholder="Search gyms, users, audit…" class="form-input pl-7 h-8 text-xs w-full" onkeydown="if(event.key==='Enter'){runGlobalSearch(this.value)}">
        </div>
        <div class="flex-1 md:hidden"></div>

        <div class="flex items-center gap-1.5 flex-shrink-0 ml-auto">
          <div class="relative">
            <button onclick="toggleNotifDd(event)" class="relative p-1.5 rounded hover:bg-charcoal-100 transition-colors" aria-label="Alerts">
              <svg class="w-4 h-4 text-charcoal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
              <span id="header-alert-dot" class="hidden absolute -top-0.5 -right-0.5 min-w-[15px] h-3.5 px-1 bg-red-500 text-white text-[8px] font-bold rounded-full items-center justify-center">0</span>
            </button>
            <div id="header-notif-dd" class="hidden absolute right-0 top-full mt-1.5 w-80 max-w-[calc(100vw-1.5rem)] bg-white rounded-xl shadow-xl border border-charcoal-200 z-50 overflow-hidden"></div>
          </div>

          <div class="relative" id="user-menu-container">
            <button onclick="toggleUserMenu()" class="flex items-center gap-2 px-1.5 py-1 rounded hover:bg-charcoal-50 transition-colors" aria-label="Account menu">
              <div class="w-7 h-7 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-[10px] font-semibold">YE</div>
              <div class="hidden md:block text-left">
                <p class="text-xs font-semibold text-charcoal-900 leading-tight">Youssef Essam</p>
                <p class="text-[10px] text-charcoal-500 leading-tight">Super Admin</p>
              </div>
              <svg class="w-3 h-3 text-charcoal-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="user-menu-dropdown" class="hidden absolute right-0 mt-1.5 w-52 bg-white rounded-lg shadow-lg border border-charcoal-100 py-1.5 z-50">
              <div class="px-3 py-1.5 border-b border-charcoal-100">
                <p class="text-xs font-medium text-charcoal-900">Youssef Essam</p>
                <p class="text-[10px] text-charcoal-500">youssef.essam@revivehr.com</p>
              </div>
              <button onclick="navigateTo('access');closeUserMenu()" class="w-full text-left px-3 py-1.5 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                My access
              </button>
              <button onclick="navigateTo('audit');closeUserMenu()" class="w-full text-left px-3 py-1.5 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Audit log
              </button>
              <div class="my-1 border-t border-charcoal-100"></div>
              <button onclick="handleLogout()" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign out
              </button>
            </div>
          </div>
        </div>
      </header>

      <main id="main-content" class="flex-1 min-h-0 flex flex-col overflow-hidden" style="padding: var(--page-padding-y) var(--page-padding-x)"></main>
    </div>
  </div>

  <!-- ==================== MODAL & TOAST ==================== -->
  <div id="modal-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-3 left-3 sm:left-auto sm:top-12 sm:bottom-auto z-[100] space-y-1.5 pointer-events-none flex flex-col items-end"></div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/data.js?v=7"></script>
  <script src="js/core.js?v=7"></script>
  <script src="js/pages-dashboard.js?v=7"></script>
  <script src="js/pages-gyms.js?v=7"></script>
  <script src="js/pages-users.js?v=7"></script>
  <script src="js/pages-user-detail.js?v=7"></script>
  <script src="js/pages-hr-managers.js?v=7"></script>
  <script src="js/pages-billing.js?v=7"></script>
  <script src="js/pages-access.js?v=7"></script>
  <script src="js/pages-audit.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
