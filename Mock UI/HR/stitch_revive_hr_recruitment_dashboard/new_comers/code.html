<!DOCTYPE html><html class="h-full" lang="en"><head>

tailwind.config={darkMode:"class",theme:{extend:{colors:{"primary":"#16a34a","primary-container":"#bbf7d0","on-primary":"#ffffff","on-primary-container":"#14532d","surface":"#fbfcfa","surface-container":"#e9eee8","surface-container-low":"#f3f6f2","surface-container-high":"#dee5dd","surface-container-highest":"#d3dcd2","surface-container-lowest":"#ffffff","on-surface":"#13221a","on-surface-variant":"#3f4a41","on-background":"#13221a","background":"#f7f9f7","secondary":"#5c5f60","outline":"#6e7b6c","outline-variant":"#c6cdc5","error":"#ba1a1a","error-container":"#ffdad6","on-error-container":"#93000a","tertiary":"#51605a","tertiary-container":"#b3c7bc","surface-tint":"#16a34a"},fontFamily:{sans:["Inter","system-ui","sans-serif"]}}}}
</script>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}.material-symbols-outlined[data-weight="fill"]{font-variation-settings:'FILL' 1;}.elevation-1{box-shadow:0px 1px 3px rgba(0,0,0,0.05);}</style>
</head>
<body class="bg-background text-on-background font-sans min-h-screen flex h-full overflow-hidden">

<!-- Sidebar -->
<nav class="fixed left-0 top-0 h-full w-[280px] bg-surface-container-low flex flex-col py-6 px-4 z-30 hidden md:flex border-r border-outline-variant">
  <div class="flex items-center gap-3 mb-8 px-2">
    <div class="w-10 h-10 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center">
      <span class="material-symbols-outlined" data-weight="fill">hub</span>
    </div>
    <div>
      <h1 class="text-[20px] font-bold text-on-surface">Revive HR</h1>
      <p class="text-[12px] text-on-surface-variant">HR Operations</p>
    </div>
  </div>
  <ul class="flex flex-col gap-1 flex-1">
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-all" href="../hr_control_center_dashboard/code.html"><span class="material-symbols-outlined">dashboard</span><span class="text-[14px] font-medium">Control Center</span></a></li>
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-all" href="../payroll_management/code.html"><span class="material-symbols-outlined">payments</span><span class="text-[14px] font-medium">Payroll</span></a></li>
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-primary font-bold bg-primary-container/10 transition-colors" href="#"><span class="material-symbols-outlined" data-weight="fill">person_add</span><span class="text-[14px] font-medium">New Comers</span></a></li>
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-all" href="../evaluation_builder/code.html"><span class="material-symbols-outlined">fact_check</span><span class="text-[14px] font-medium">Evaluations</span></a></li>
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-all" href="../termination_workflow/code.html"><span class="material-symbols-outlined">person_off</span><span class="text-[14px] font-medium">Termination</span></a></li>
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-all" href="../permissions_matrix/code.html"><span class="material-symbols-outlined">admin_panel_settings</span><span class="text-[14px] font-medium">Permissions</span></a></li>
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-all" href="../recruitment_dashboard/code.html"><span class="material-symbols-outlined">person_search</span><span class="text-[14px] font-medium">Recruitment</span></a></li>
  </ul>
  <ul class="flex flex-col gap-1 mt-auto pt-4 border-t border-outline-variant">
    <li><a class="flex items-center gap-3 px-4 py-3 rounded-lg text-error hover:bg-error-container/20 transition-all" href="#"><span class="material-symbols-outlined">logout</span><span class="text-[14px] font-medium">Logout</span></a></li>
  </ul>
</nav>

<!-- Main Content -->
<main class="flex-1 ml-0 md:ml-[280px] h-full flex flex-col relative overflow-hidden">
  <!-- Top Bar -->
  <header class="w-full h-16 bg-surface flex justify-between items-center px-4 md:px-8 z-10 sticky top-0 shrink-0 border-b border-outline-variant">
    <div class="flex items-center gap-4 flex-1">
      <h1 class="text-[18px] font-bold text-on-surface hidden lg:block">New Comers</h1>
    </div>
    <div class="flex items-center gap-4">
      <button id="btn-new-hire" class="hidden sm:flex items-center gap-2 px-4 py-2 bg-primary text-on-primary rounded-lg text-[13px] font-semibold hover:opacity-90 transition-opacity">
        <span class="material-symbols-outlined text-[18px]">person_add</span> Add New Hire
      </button>
      <div class="ml-2 pl-4 border-l border-outline-variant flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-[13px] font-bold">HO</div>
        <div class="hidden sm:block">
          <p class="text-[13px] font-semibold text-on-surface leading-tight">Hana Osman</p>
          <p class="text-[11px] text-on-surface-variant leading-tight">HR Operations</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Canvas -->
  <div class="flex-1 overflow-y-auto p-4 md:p-8 bg-background">
    <div class="max-w-[1440px] mx-auto space-y-6">

      <!-- Tabs -->
      <div class="flex items-center gap-3 border-b border-outline-variant overflow-x-auto">
        <button class="tab-btn tab-active px-4 py-3 text-[14px] font-semibold text-primary border-b-2 border-primary whitespace-nowrap">Hires</button>
        <button class="tab-btn px-4 py-3 text-[14px] font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface whitespace-nowrap flex items-center gap-2">Onboarding <span class="px-1.5 rounded-full bg-primary-container text-on-primary-container text-[11px]">2</span></button>
        <button class="tab-btn px-4 py-3 text-[14px] font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface whitespace-nowrap">All Accounts</button>
      </div>

      <!-- Hires List -->
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="hires-grid"></div>

    </div>
  </div>
</main>

<!-- Create Hire Drawer -->
<div id="drawer-backdrop" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
<div id="drawer" class="fixed top-0 right-0 h-full w-full max-w-lg bg-surface z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto">
  <div id="drawer-content"></div>
</div>

<script>
const hires=[
  {id:'RV-00139',name:'Mostafa Adel',position:'Trainer',branch:'Heliopolis',startDate:'Sep 1, 2026',status:'Account Created',progress:60,initials:'MA'},
  {id:'RV-00140',name:'Dina Mostafa',position:'Receptionist',branch:'New Cairo',startDate:'Sep 6, 2026',status:'Pending Approval',progress:20,initials:'DM'},
  {id:'RV-00141',name:'Sherif Kamel',position:'Maintenance',branch:'Nasr City',startDate:'Sep 12, 2026',status:'Onboarding',progress:85,initials:'SK'},
];

const checklist=[
  {label:'Create employee account',done:true},
  {label:'Assign branch & department',done:true},
  {label:'Set permissions & role',done:true},
  {label:'Schedule onboarding session',done:false},
  {label:'Issue uniform & access card',done:false},
  {label:'Add to payroll roster',done:false},
  {label:'Complete safety training',done:false},
];

function statusStyle(s){
  const m={'Account Created':'bg-blue-100 text-blue-800','Pending Approval':'bg-yellow-100 text-yellow-800',Onboarding:'bg-green-100 text-green-800'};
  return m[s]||'bg-gray-100 text-gray-600';
}
function progressColor(p){
  if(p>=80)return'bg-green-500';
  if(p>=40)return'bg-yellow-500';
  return'bg-blue-500';
}

function renderHires(){
  const grid=document.getElementById('hires-grid');
  grid.innerHTML=hires.map((h,i)=>`
    <div class="bg-surface rounded-xl p-5 elevation-1 border border-outline-variant/40">
      <div class="flex items-start justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-[14px] font-bold">${h.initials}</div>
          <div>
            <h3 class="text-[15px] font-semibold text-on-surface">${h.name}</h3>
            <p class="text-[12px] text-on-surface-variant">${h.position} · ${h.id}</p>
          </div>
        </div>
        <span class="text-[11px] text-on-surface-variant">${h.startDate}</span>
      </div>
      <div class="flex items-center justify-between mb-1.5">
        <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${statusStyle(h.status)}">${h.status}</span>
        <span class="text-[12px] font-semibold text-on-surface">${h.progress}%</span>
      </div>
      <div class="h-2 rounded-full bg-surface-container-high overflow-hidden mb-4"><div class="h-2 rounded-full ${progressColor(h.progress)}" style="width:${h.progress}%"></div></div>
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-[16px] text-secondary">store</span>
        <span class="text-[12px] text-on-surface-variant">${h.branch}</span>
      </div>
      <div class="mt-4 pt-3 border-t border-outline-variant/30 flex gap-2">
        <button onclick="openOnboarding(${i})" class="flex-1 py-2 rounded-lg bg-primary-container/40 text-primary text-[13px] font-semibold hover:bg-primary-container transition-colors">Onboarding</button>
        <button onclick="toast('Account details copied')" class="flex items-center justify-center w-10 h-9 rounded-lg bg-surface-container-low text-on-surface-variant hover:bg-surface-container-high transition-colors" title="Copy invite"><span class="material-symbols-outlined text-[18px]">content_copy</span></button>
      </div>
    </div>
  `).join('');
}

function openOnboarding(i){
  const h=hires[i];
  const done=checklist.filter(c=>c.done).length;
  const pct=Math.round(done/checklist.length*100);
  document.getElementById('drawer-content').innerHTML=`
    <div class="p-5">
      <div class="flex items-start justify-between mb-5">
        <button onclick="closeDrawer()" class="w-9 h-9 rounded-lg flex items-center justify-center text-secondary hover:bg-surface-container-high transition-colors"><span class="material-symbols-outlined">close</span></button>
        <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${statusStyle(h.status)}">${h.status}</span>
      </div>
      <div class="flex items-center gap-3 mb-6">
        <div class="w-14 h-14 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-[18px] font-bold">${h.initials}</div>
        <div>
          <h2 class="text-[18px] font-bold text-on-surface">${h.name}</h2>
          <p class="text-[13px] text-on-surface-variant">${h.position} · ${h.branch}</p>
          <p class="text-[12px] text-on-surface-variant mt-0.5">Starts ${h.startDate} · ${h.id}</p>
        </div>
      </div>
      <div class="mb-2 flex items-center justify-between">
        <h3 class="text-[14px] font-semibold text-on-surface">Onboarding Checklist</h3>
        <span class="text-[12px] font-semibold text-primary">${done}/${checklist.length}</span>
      </div>
      <div class="h-2 rounded-full bg-surface-container-high overflow-hidden mb-4"><div class="h-2 rounded-full bg-primary" style="width:${pct}%"></div></div>
      <div class="space-y-2" id="checklist">
        ${checklist.map((c,ci)=>`
          <div class="flex items-center gap-3 p-3 rounded-lg ${c.done?'bg-primary-container/20':'bg-surface-container-low'}">
            <button onclick="toggleTask(${ci})" class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${c.done?'bg-primary border-primary text-on-primary':'border-outline text-secondary'}">
              ${c.done?'<span class="material-symbols-outlined text-[14px]">check</span>':''}
            </button>
            <span class="text-[13px] ${c.done?'text-on-surface-variant line-through':'text-on-surface font-medium'}">${c.label}</span>
          </div>
        `).join('')}
      </div>
      <button onclick="notifyHire()" class="w-full mt-5 py-3 rounded-lg bg-primary text-on-primary font-semibold text-[14px] hover:opacity-90 transition-opacity">Send Invite to Employee</button>
    </div>
  `;
  document.getElementById('drawer-backdrop').classList.remove('hidden');
  document.getElementById('drawer').classList.remove('translate-x-full');
}
function closeDrawer(){
  document.getElementById('drawer').classList.add('translate-x-full');
  document.getElementById('drawer-backdrop').classList.add('hidden');
}
function toggleTask(i){
  checklist[i].done=!checklist[i].done;
  // refresh current drawer checklist
  const panel=document.getElementById('checklist');
  if(panel){
    const done=checklist.filter(c=>c.done).length;
    panel.innerHTML=checklist.map((c,ci)=>`
      <div class="flex items-center gap-3 p-3 rounded-lg ${c.done?'bg-primary-container/20':'bg-surface-container-low'}">
        <button onclick="toggleTask(${ci})" class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${c.done?'bg-primary border-primary text-on-primary':'border-outline text-secondary'}">
          ${c.done?'<span class="material-symbols-outlined text-[14px]">check</span>':''}
        </button>
        <span class="text-[13px] ${c.done?'text-on-surface-variant line-through':'text-on-surface font-medium'}">${c.label}</span>
      </div>
    `).join('');
  }
}
function notifyHire(){toast('Invite sent to employee email');closeDrawer();}

// toast helper
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div');
    t.id='toast';
    t.className='fixed bottom-6 right-6 hidden items-center gap-2 px-4 py-3 rounded-lg bg-on-surface text-surface shadow-lg z-50';
    t.innerHTML='<span class="material-symbols-outlined text-[18px] text-green-400">check_circle</span><span id="toast-msg" class="text-[13px] font-medium"></span>';
    document.body.appendChild(t);
  }
  document.getElementById('toast-msg').textContent=msg;
  t.classList.remove('hidden');t.classList.add('flex');
  setTimeout(()=>{t.classList.add('hidden');t.classList.remove('flex');},2500);
}

document.getElementById('drawer-backdrop').addEventListener('click',closeDrawer);
document.getElementById('btn-new-hire').addEventListener('click',()=>{
  openOnboarding(0);
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>{b.className='tab-btn px-4 py-3 text-[14px] font-medium text-on-surface-variant border-b-2 border-transparent hover:text-on-surface whitespace-nowrap flex items-center gap-2';});
    btn.className='tab-btn tab-active px-4 py-3 text-[14px] font-semibold text-primary border-b-2 border-primary whitespace-nowrap flex items-center gap-2';
    if(btn.textContent.includes('Hires'))renderHires();
    else toast('View: '+btn.textContent.trim());
  });
});

renderHires();
</script>
</body></html>
