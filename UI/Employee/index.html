<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Revive HR — Employee Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            },
            charcoal: {
              50: '#f8f9fa',
              100: '#f1f3f5',
              200: '#e9ecef',
              300: '#dee2e6',
              400: '#ced4da',
              500: '#adb5bd',
              600: '#6c757d',
              700: '#495057',
              800: '#343a40',
              900: '#212529',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-gray-50 font-sans text-charcoal-800 antialiased">

  <!-- ==================== DESKTOP SHELL ==================== -->
  <div id="app-shell" class="hidden lg:flex h-full">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-charcoal-200 flex flex-col transition-transform duration-300 lg:translate-x-0 -translate-x-full" data-sidebar>

      <!-- Logo -->
      <div class="flex items-center gap-3 px-6 h-16 border-b border-charcoal-100 flex-shrink-0">
        <div class="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <span class="text-lg font-bold text-charcoal-900">Revive<span class="text-brand-600">HR</span></span>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="sidebar-nav">
        <!-- Populated by JS -->
      </nav>

      <!-- Sidebar Footer: User -->
      <div class="border-t border-charcoal-100 px-4 py-3 flex-shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-sm font-semibold" id="sidebar-avatar">AM</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-charcoal-900 truncate" id="sidebar-user-name">Ahmed Mohamed</p>
            <p class="text-xs text-charcoal-500 truncate" id="sidebar-user-role">Trainer</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="closeSidebar()"></div>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col ml-64">

      <!-- HEADER -->
      <header class="sticky top-0 z-20 bg-white border-b border-charcoal-100 h-16 flex items-center px-4 lg:px-6 gap-4 flex-shrink-0">

        <!-- Mobile hamburger -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-charcoal-100" aria-label="Toggle menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <!-- Page title (mobile) -->
        <h1 class="lg:hidden text-base font-semibold text-charcoal-900" id="mobile-page-title">Dashboard</h1>

        <!-- Spacer -->
        <div class="flex-1"></div>

        <!-- Header right -->
        <div class="flex items-center gap-3">
          <!-- Notification bell -->
          <button onclick="navigateTo('notifications')" class="relative p-2 rounded-lg hover:bg-charcoal-100 transition-colors" aria-label="Notifications">
            <svg class="w-5 h-5 text-charcoal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-brand-500 rounded-full" id="header-notif-dot"></span>
          </button>

          <!-- User menu -->
          <div class="relative" id="user-menu-container">
            <button onclick="toggleUserMenu()" class="flex items-center gap-2.5 p-1.5 rounded-lg hover:bg-charcoal-50 transition-colors" aria-label="User menu">
              <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-xs font-semibold" id="header-avatar">AM</div>
              <div class="hidden md:block text-left">
                <p class="text-sm font-medium text-charcoal-900 leading-tight" id="header-user-name">Ahmed Mohamed</p>
                <p class="text-xs text-charcoal-500 leading-tight" id="header-user-meta">Trainer · Revive Gym</p>
              </div>
              <svg class="w-4 h-4 text-charcoal-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>

            <!-- Dropdown -->
            <div id="user-menu-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-charcoal-100 py-1.5 z-50">
              <div class="px-3 py-1.5 border-b border-charcoal-100">
                <p class="text-xs font-medium text-charcoal-900" id="menu-user-name">Ahmed Mohamed</p>
                <p class="text-[10px] text-charcoal-500" id="menu-user-email">ahmed.mohamed@revive.com</p>
              </div>
              <button onclick="navigateTo('profile'); closeUserMenu()" class="w-full text-left px-3 py-2 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                My Profile
              </button>
              <button onclick="navigateTo('history'); closeUserMenu()" class="w-full text-left px-3 py-2 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                Employment History
              </button>
              <button onclick="navigateTo('evaluations'); closeUserMenu()" class="w-full text-left px-3 py-2 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                My Evaluations
              </button>
              <button onclick="navigateTo('notifications'); closeUserMenu()" class="w-full text-left px-3 py-2 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                Notifications
              </button>
              <button onclick="navigateTo('settings'); closeUserMenu()" class="w-full text-left px-3 py-2 text-xs text-charcoal-700 hover:bg-charcoal-50 flex items-center gap-2.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Settings
              </button>
              <div class="border-t border-charcoal-100 mt-1 pt-1">
                <button onclick="handleLogout()" class="w-full text-left px-3 py-2 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2.5">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                  Logout
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="flex-1 overflow-y-auto p-4 lg:p-6" id="main-content">
        <!-- Page content rendered here by JS -->
      </main>
    </div>
  </div>

  <!-- ==================== MOBILE SHELL ==================== -->
  <div id="mobile-shell" class="lg:hidden flex flex-col h-full">

    <!-- Mobile Header -->
    <header class="sticky top-0 z-20 bg-white border-b border-charcoal-100 h-14 flex items-center px-4 gap-3 flex-shrink-0">
      <button onclick="toggleSidebar()" class="p-2 -ml-2 rounded-lg hover:bg-charcoal-100" aria-label="Menu">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-brand-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <span class="text-base font-bold text-charcoal-900">Revive<span class="text-brand-600">HR</span></span>
      </div>
      <div class="flex-1"></div>
      <button onclick="navigateTo('notifications')" class="relative p-2 rounded-lg hover:bg-charcoal-100" aria-label="Notifications">
        <svg class="w-5 h-5 text-charcoal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-brand-500 rounded-full"></span>
      </button>
      <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center text-xs font-semibold cursor-pointer" onclick="navigateTo('profile')">AM</div>
    </header>

    <!-- Mobile Content -->
    <main class="flex-1 overflow-y-auto pb-20" id="mobile-content">
      <!-- Page content rendered here by JS -->
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-charcoal-100 z-30 flex items-center justify-around h-16 safe-bottom" id="mobile-bottom-nav">
      <button onclick="navigateTo('dashboard')" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5" data-page="dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button onclick="navigateTo('schedule')" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5" data-page="schedule">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span class="text-[10px] font-medium">Schedule</span>
      </button>
      <button onclick="navigateTo('requests')" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5" data-page="requests">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span class="text-[10px] font-medium">Requests</span>
      </button>
      <button onclick="navigateTo('notifications')" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5 relative" data-page="notifications">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span class="absolute -top-0.5 right-1 w-4 h-4 bg-brand-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">3</span>
        <span class="text-[10px] font-medium">Alerts</span>
      </button>
      <button onclick="toggleMobileMore()" class="mobile-nav-btn flex flex-col items-center gap-0.5 px-3 py-1.5" data-page="more">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span class="text-[10px] font-medium">More</span>
      </button>
    </nav>

    <!-- Mobile Sidebar Overlay -->
    <div id="mobile-sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="closeSidebar()"></div>

    <!-- Mobile Sidebar Drawer -->
    <div id="mobile-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-xl transform -translate-x-full transition-transform duration-300 flex flex-col">
      <div class="flex items-center gap-3 px-5 h-14 border-b border-charcoal-100 flex-shrink-0">
        <div class="w-7 h-7 bg-brand-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <span class="text-base font-bold text-charcoal-900">Revive<span class="text-brand-600">HR</span></span>
        <button onclick="closeSidebar()" class="ml-auto p-1.5 rounded-lg hover:bg-charcoal-100">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <nav class="flex-1 overflow-y-auto py-3 px-3 space-y-0.5" id="mobile-sidebar-nav">
        <!-- Populated by JS -->
      </nav>
      <div class="border-t border-charcoal-100 px-4 py-3 flex-shrink-0">
        <button onclick="handleLogout()" class="w-full text-left px-3 py-2.5 text-sm text-red-600 hover:bg-red-50 rounded-lg flex items-center gap-3 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </div>

    <!-- Mobile More Menu -->
    <div id="mobile-more-menu" class="hidden fixed inset-0 z-40">
      <div class="absolute inset-0 bg-black/40" onclick="closeMobileMore()"></div>
      <div class="absolute bottom-16 left-4 right-4 bg-white rounded-2xl shadow-xl border border-charcoal-100 p-2 max-h-[70vh] overflow-y-auto">
        <div class="grid grid-cols-3 gap-2" id="mobile-more-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== MODAL CONTAINER ==================== -->
  <div id="modal-container"></div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toast-container" class="fixed top-4 right-4 z-[100] space-y-2 pointer-events-none"></div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/data.js?v=2"></script>
  <script src="js/core.js?v=2"></script>
  <script src="js/pages-employee.js?v=2"></script>
  <script src="js/pages-employee2.js?v=2"></script>
  <script src="js/pages-management.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
