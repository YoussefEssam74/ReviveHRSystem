<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="login-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.48" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="login-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="login-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="login-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="login-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0f172a" fill-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#login-bg)"/>
  <rect width="1600" height="1000" fill="url(#login-dots)"/>

  <circle cx="120" cy="80" r="460" fill="url(#login-glow-a)"/>
  <circle cx="1500" cy="900" r="520" fill="url(#login-glow-b)"/>
  <circle cx="1420" cy="120" r="260" fill="url(#login-glow-a)" opacity="0.65"/>
  <circle cx="180" cy="860" r="300" fill="url(#login-glow-b)" opacity="0.7"/>

  <!-- Concentric rings echo a gym plate and keep the right side from feeling empty. -->
  <g fill="none" stroke="#0f766e" stroke-opacity="0.08">
    <circle cx="1370" cy="250" r="150" stroke-width="2"/>
    <circle cx="1370" cy="250" r="230" stroke-width="1.5"/>
    <circle cx="1370" cy="250" r="320" stroke-width="1"/>
  </g>

  <!-- Oversized line-art dumbbell watermark. -->
  <g transform="translate(560 640) rotate(-12)" fill="none" stroke="#0f766e" stroke-opacity="0.085" stroke-width="3">
    <rect x="-170" y="-16" width="340" height="32" rx="16"/>
    <rect x="-235" y="-46" width="46" height="92" rx="14"/>
    <rect x="189" y="-46" width="46" height="92" rx="14"/>
    <rect x="-305" y="-100" width="56" height="200" rx="18"/>
    <rect x="249" y="-100" width="56" height="200" rx="18"/>
    <rect x="-380" y="-132" width="64" height="264" rx="20"/>
    <rect x="316" y="-132" width="64" height="264" rx="20"/>
  </g>

  <path d="M-120 780 C 280 660, 620 860, 1000 740 S 1540 580, 1720 690 L 1720 1080 L -120 1080 Z" fill="url(#login-ribbon)"/>
  <path d="M-120 840 C 320 720, 680 930, 1080 790 S 1560 640, 1720 750" fill="none" stroke="#10b981" stroke-opacity="0.16" stroke-width="2"/>

  <g opacity="0.45" fill="none" stroke="#0f172a" stroke-opacity="0.07">
    <rect x="170" y="170" width="96" height="96" rx="22" transform="rotate(-9 218 218)"/>
    <circle cx="1460" cy="620" r="34"/>
    <circle cx="80" cy="500" r="18"/>
  </g>
</svg>
